[project]
name = "optishift-ai"
version = "0.1.0"
description = "Deterministic AI-assisted workforce scheduling with CP-SAT validation and versioned replanning"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
include = ["backend"]

