name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_ENABLED: "false"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate Python compilation
        run: python -m compileall -q backend/app
      - name: Validate Alembic migration heads
        run: alembic heads
      - name: Validate acceptance harness regressions
        run: python -m pytest -q tests/evals/test_multiturn_harness.py tests/test_dialogue_repository.py tests/test_dialogue_state.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  end-to-end-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-workforce-scheduler:ci

  deploy-cloudbase:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      TCB_API_KEY: ${{ secrets.TCB_API_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @cloudbase/cli@3.8.2
      - name: Prepare revision-stamped deployment source
        run: |
          mkdir -p "$RUNNER_TEMP/cloudbase-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cloudbase-source"
          printf '%s' "$GITHUB_SHA" > "$RUNNER_TEMP/cloudbase-source/backend/COMMIT_SHA"
      - name: Deploy main to CloudBase Run
        run: |
          set +e
          tcb --yes --env-id "$TCB_ENV_ID" login --cloudbase-api-key "$TCB_API_KEY" --json
          status=1
          for attempt in 1 2; do
            echo "CloudBase deployment attempt ${attempt}/2"
            tcb --yes --env-id "$TCB_ENV_ID" cloudrun deploy \
              --service-name optishift-ai \
              --source "$RUNNER_TEMP/cloudbase-source" \
              --port 8080 \
              --min-num 0 \
              --max-num 1 \
              --open-access-types PUBLIC,VPC \
              --force \
              --wait \
              --json
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo 'CloudBase deployment failed; retrying after 20 seconds...'
              sleep 20
            fi
          done
          exit "$status"
      - name: Dump CloudBase deployment diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          echo '--- CloudBase deployment records ---'
          tcb --yes --env-id "$TCB_ENV_ID" cloudrun record list \
            --service-name optishift-ai --json
          echo '--- CloudBase build log ---'
          tcb --yes --env-id "$TCB_ENV_ID" cloudrun logs build \
            --service-name optishift-ai --json
