services:
  optishift:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/optishift.db
      LLM_ENABLED: "false"
      PORT: "8080"
    volumes:
      - optishift-data:/app/data
    restart: unless-stopped

volumes:
  optishift-data:
